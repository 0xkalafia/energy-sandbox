name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # Nothing else here reads vercel.json, so an error in it clears every
      # step above and only surfaces as a failed deployment minutes later.
      # That is how the first deploy of this project failed. Unlike the browser
      # checks this one is deterministic and font-independent, so it belongs.
      - name: Validate vercel.json
        run: npm run check:vercel
